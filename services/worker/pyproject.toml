[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "tabscribe-worker"
version = "0.1.0"
description = "Queue consumer: runs one pipeline stage per message; a thin wrapper around the pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tabscribe-pipeline",
    "tabscribe-platform",
]

[tool.uv.sources]
tabscribe-pipeline = { workspace = true }
tabscribe-platform = { workspace = true }

[tool.uv.build-backend]
module-name = "worker"
