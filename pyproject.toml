# Monorepo root: a virtual uv workspace (no package of its own).
# Shared tool config (ruff, mypy, pytest) lives here so every Python package follows the same rules.

[tool.uv]
# Supported platforms: Linux (servers, CI) and Apple Silicon Macs (development). Intel Macs are
# left out because demucs pins numpy<2 there, which conflicts with the rest of the pipeline.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.workspace]
members = ["packages/pipeline", "packages/platform", "services/api"]

[tool.uv.sources]
tabscribe-pipeline = { workspace = true }
tabscribe-platform = { workspace = true }
tabscribe-api = { workspace = true }

[dependency-groups]
dev = [
    "tabscribe-pipeline",
    "tabscribe-platform",
    "tabscribe-api",
    "httpx2>=2.13",  # FastAPI/Starlette TestClient runs on it; replaces httpx there (BSD-3)
    "maturin>=1.7,<2",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "pyloudnorm>=0.1.1",  # reference implementation that tests check our loudness against (MIT)
    "mir-eval>=0.8",
]

# `uv sync --group separation` adds Demucs; not part of the default install or CI.
separation = ["tabscribe-pipeline[separation]"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "tabscribe_platform", "api"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = [
    "packages/pipeline/src", "packages/pipeline/tests", "tools/preview",
    "packages/platform/src", "packages/platform/tests",
    "services/api/src", "services/api/tests",
    "testsupport",
]
explicit_package_bases = true
mypy_path = "packages/pipeline/src:packages/pipeline/tests:packages/platform/src:services/api/src"

[[tool.mypy.overrides]]
module = [
    "alembic.*", "demucs", "demucs.*", "mido", "mir_eval", "mir_eval.*", "onnxruntime", "pyloudnorm", "scipy", "scipy.*", "soundfile", "torch",
]
ignore_missing_imports = true

# Only imported by the fixtures' make_reference.py scripts, which run in throwaway envs.
[[tool.mypy.overrides]]
module = ["basic_pitch", "basic_pitch.*", "librosa", "librosa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/pipeline/tests", "packages/platform/tests", "services/api/tests"]
pythonpath = [
    ".",  # testsupport/: fixtures shared across packages
    "packages/pipeline/tests",  # test helpers such as basic_pitch_oracle
]
addopts = "--import-mode=importlib -m 'not accuracy and not separation'"
markers = [
    "unit: fast tests, no ML models",
    "integration: needs the local services from `make up` (Postgres, Redis, S3)",
    "golden: compares deterministic stage output with committed snapshots",
    "accuracy: runs real models and checks mir_eval metrics against baselines",
    "separation: needs the optional Demucs install (`uv sync --group separation`)",
]
