name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # Postgres, Redis and S3 for the integration tests: the same docker-compose stack as
      # `make up` (SeaweedFS needs a command line, which GitHub service containers can't set).
      - run: make up
      # Ubuntu's ffmpeg is a GPL build; fine for tests, not for shipping (TD-9).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run pytest -m accuracy -s -q  # mir_eval scores vs tests/accuracy_baseline.json

  # The whole backend in containers (the images we ship), driven like the mobile app would.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked  # the e2e script mints dev tokens with the api package
      - run: make stack
      - run: make e2e
      - if: failure()
        run: docker compose --profile app logs --no-color --tail 200

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: make mobile-check

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
