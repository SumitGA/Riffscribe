name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # Backing services for the platform/API integration tests (same images as docker-compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tabscribe
          POSTGRES_PASSWORD: tabscribe
          POSTGRES_DB: tabscribe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabscribe" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tabscribe:tabscribe@localhost:5432/tabscribe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # Ubuntu's ffmpeg is a GPL build; fine for tests, not for shipping (TD-9).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run pytest -m accuracy -s -q  # mir_eval scores vs tests/accuracy_baseline.json

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
