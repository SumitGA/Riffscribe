#cloud-config
# First boot of the staging VM (ADR-0010): Docker with the compose plugin, automatic security
# updates, and /srv/riffscribe for the stack and Postgres's files (on the root disk).
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, unattended-upgrades]

write_files:
  # The lab's tenant network carries 1442-byte packets; Docker's default 1500 makes large ones
  # (TLS handshakes) vanish. The staging stack sets its own network's MTU too (compose.yml).
  - path: /etc/docker/daemon.json
    content: |
      {"mtu": 1442}

runcmd:
  - mkdir -p /srv/riffscribe/postgres /srv/riffscribe/stack
  - chown ubuntu:ubuntu /srv/riffscribe/stack
  # Docker's own packages (the compose plugin isn't in Ubuntu's): https://docs.docker.com/engine/install/ubuntu/
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker unattended-upgrades
