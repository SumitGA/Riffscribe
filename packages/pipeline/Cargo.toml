[package]
name = "tabcore"
version = "0.1.0"
edition = "2024"
publish = false
description = "CPU-bound pipeline kernels (tab fingering search) exposed to Python via PyO3"

[lib]
name = "_tabcore"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3: one wheel works on every CPython >= 3.12.
# `extension-module` is enabled only by maturin (pyproject.toml) so `cargo test` can link.
pyo3 = { version = "0.29", features = ["abi3-py312"] }
