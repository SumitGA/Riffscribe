[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tabscribe-pipeline"
version = "0.1.0"
description = "Audio -> MIDI -> MusicXML -> guitar tab transcription pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mido>=1.3",          # writes the transcription's MIDI file (MIT)
    "numpy>=2",           # audio arrays (BSD-3)
    "onnxruntime>=1.18",  # runs the Basic Pitch model on CPU (MIT)
    "pydantic>=2.8,<3",   # typed stage inputs/outputs and manifests (MIT)
    "scipy>=1.13",        # loudness filters, resampling, FFTs for tempo (BSD-3)
    "soundfile>=0.12",    # FLAC read/write; bundles libsndfile, LGPL-2.1 (BSD-3)
    "typer>=0.12",        # CLI, `python -m pipeline` (MIT)
]

[project.optional-dependencies]
# Demucs source separation, off by default (ADR-0004, TD-1). Pulls in torch (~630 MB).
# demucs: MIT; its dependency lameenc is LGPL-3.0 (MP3 encoding, unused by us).
separation = ["demucs>=4.1"]

[project.scripts]
tabscribe-pipeline = "pipeline.cli:app"

[tool.maturin]
python-source = "src"
module-name = "pipeline._tabcore"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]

[tool.uv]
# Rebuild the Rust extension when Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "rust/**/*.rs" }]
